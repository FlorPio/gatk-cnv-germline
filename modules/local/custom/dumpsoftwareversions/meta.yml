name: "custom_dumpsoftwareversions"
description: Custom module to dump software versions collected during pipeline execution
keywords:
  - versions
  - custom
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
      licence: ["PSF-2.0"]

input:
  - versions:
      type: file
      description: YML file containing software versions collected from pipeline processes
      pattern: "collated_versions.yml"

output:
  - yml:
      type: file
      description: Software versions in YAML format
      pattern: "software_versions.yml"
  - mqc_yml:
      type: file
      description: Software versions formatted for MultiQC
      pattern: "software_versions_mqc.yml"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@bioinformatics"
